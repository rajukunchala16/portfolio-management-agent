services:
  - type: web
    name: portfolio-agent
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.single
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 8000
      - key: STREAMLIT_PORT
        value: 8501
      - key: PORTFOLIO_AGENT_API_URL
        value: http://127.0.0.1:8000
